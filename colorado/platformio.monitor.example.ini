[cmesh_bot_ntp]
build_flags =
  -D BOT_NTP_SYNC=1
  -D BOT_NTP_SSID='"PRIMARY_SSID"'
  -D BOT_NTP_PASSWORD='"PRIMARY_PASSWORD"'
  -D BOT_WIFI_SECONDARY_SSID='"SECONDARY_SSID"'
